<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissor Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Rock Paper Scissors Game</h1>
  <p>Choose your move:</p>
  <div class="buttons">
    <button id="rock" style="background-color: red;">&#x1f44A;</button><button id="paper" style="background-color: blue;">&#x1f590;</button><button id="scissor" style="background-color: green;">&#x270c;</button>
  </div>
  <p id="result">You Won!</p>
  <p id="score">Your score:<span id="user-score" style="color: skyblue; ">0</span> Computer Score:<span id="computer-score" style="color: red;">0</span></p>
  
  <!-- notes jo span hota hai uski help se hum kisi chiz ko wrap krke srf usme styling laga skte hai yaad rkhna hai always -->
  
</body>
<script src="script.js"></script>
</html>
